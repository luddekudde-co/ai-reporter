<div
  class="c-feed-filter-bar"
  [class.c-feed-filter-bar--search-is-open]="mobileSearchOpen()"
>
  <div class="c-feed-filter-bar__nav">
    <app-nav-menu [navItems]="navItems()" />
  </div>

  <button
    class="c-feed-filter-bar__search-toggle"
    type="button"
    aria-label="Open search"
    (click)="openMobileSearch()"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
  </button>

  <div class="c-feed-filter-bar__search">
    <input
      #searchInput
      class="c-feed-filter-bar__search-input"
      type="text"
      placeholder="Search articles..."
      [value]="feedStore.searchQuery()"
      (keyup.enter)="onSearchCommit(searchInput.value)"
      (blur)="onBlur(searchInput.value)"
    />
  </div>

  <div class="c-feed-filter-bar__sort">
    <app-dropdown #dd [label]="activeSortLabel()">
      @for (option of sortOptions; track option.value) {
        <button
          class="c-feed-filter-bar__sort-item"
          [class.c-feed-filter-bar__sort-item--is-active]="
            activeSort() === option.value
          "
          (click)="selectSort(option.value, dd)"
        >
          {{ option.label }}
        </button>
      }
    </app-dropdown>
  </div>
</div>
